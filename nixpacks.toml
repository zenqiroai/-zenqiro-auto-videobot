[phases.setup]
nixPkgs = ["chromium"]

[phases.install]
cmds = [
    "ln -s /usr/bin/chromium /usr/bin/google-chrome",
    "CHROMEDRIVER_VERSION=$(chromium --version | grep -oP '\\d+' | head -1) && wget -O /tmp/chromedriver.zip https://storage.googleapis.com/chrome-for-testing-public/$CHROMEDRIVER_VERSION/linux64/chromedriver-linux64.zip && unzip /tmp/chromedriver.zip -d /usr/bin/ && mv /usr/bin/chromedriver-linux64/chromedriver /usr/bin/chromedriver && chmod +x /usr/bin/chromedriver"
]

[start]
cmd = "python main.py"